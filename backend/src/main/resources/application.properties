server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/couple_date_vault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=${JWT_SECRET:change-me-in-prod-please-change-me}
app.jwt.expiry-minutes=120
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
app.uploads.root=${UPLOAD_ROOT:uploads}
app.uploads.max-files=5
app.invites.expiry-days=7
app.frontend.invite-url=${FRONTEND_INVITE_URL:http://localhost:5173/accept-invite?token=}

CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:local}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:local}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:local}

logging.level.org.springframework.security=INFO
logging.level.com.coupled.vault=INFO

spring.config.import=optional:file:./local.properties,optional:file:local.properties


